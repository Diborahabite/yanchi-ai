<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="referrer" content="no-referrer" />
    <meta name="robots" content="noindex, nofollow" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    
    <!-- Mobile Web App & PWA Support -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#181226" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Calculator" />
    <link rel="apple-touch-icon" href="/calc-icon.svg" />

    <title>Yanchi AI (ያንቺ AI) — Confidential Sanctuary & First Responder</title>
    <meta name="description" content="Yanchi AI is an empathetic, zero-trust, highly secure digital sanctuary and first responder for Ethiopian women, adolescent girls, and factory workers." />
    
    <!-- Fonts: Plus Jakarta Sans & Noto Sans Ethiopic for authentic Amharic / Tigrinya -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Ethiopic:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      // Clean up any stale service workers in development mode to prevent script interception
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(registrations => {
          for (const registration of registrations) {
            registration.unregister();
          }
        });
      }
    </script>
  </body>
</html>
